<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAB Lighthouse</title>
    <!-- Stile della Mappa Integrata -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <!-- Librerie esterne -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <!-- Header dell'App (Tema Chiaro) -->
    <header class="app-header">
        <div class="header-titles">
            <h1>MAB Lighthouse</h1>
            <h2 id="activity-title">Nessuna rotta caricata</h2>
        </div>
        <button id="btn-config" class="icon-button">⚙️</button>
    </header>

    <!-- Griglia Principale dei 4 Pulsanti -->
    <main class="app-container">
        <div class="grid-buttons">
            <button id="btn-fly" class="exp-button" disabled>
                <span class="icon">🛸</span>
                <span class="label">FLY</span>
            </button>
            <button id="btn-play" class="exp-button" disabled>
                <span class="icon">🎵</span>
                <span class="label">PLAY</span>
            </button>
            <button id="btn-hear" class="exp-button" disabled>
                <span class="icon">🗣️</span>
                <span class="label">HEAR</span>
            </button>
            <button id="btn-image" class="exp-button" disabled>
                <span class="icon">📸</span>
                <span class="label">IMAGE</span>
            </button>
        </div>
    </main>

    <audio id="audio-player" controls style="display:none;"></audio>
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">

    <!-- SCHERMATA MAPPA INTEGRATA (FLY) -->
    <div id="map-screen" class="full-screen-view">
        <header class="view-header">
            <button id="btn-close-map" class="back-button">⬅️ Indietro</button>
            <h3>Mappa Zenitale</h3>
        </header>
        <div id="map"></div>
    </div>

    <!-- SCHERMATA MODALE CONFIGURAZIONE -->
    <div id="qr-modal" class="modal">
        <div class="modal-content">
            <h2>Configurazione Rotta</h2>
            <div id="reader" style="width: 100%;"></div>
            
            <div class="manual-input-zone">
                <p>Oppure incolla il link del Foglio Google:</p>
                <input type="text" id="input-manual-url" placeholder="https://docs.google.com/spreadsheets/...">
                <button id="btn-save-manual" class="primary-button">Carica Link</button>
            </div>
            
            <button id="btn-close-qr" class="close-button">Chiudi</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
